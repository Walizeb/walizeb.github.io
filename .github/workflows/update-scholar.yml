name: Update Google Scholar Metrics

on:

  # Run every Monday at 06:00 UTC
  schedule:

    - cron: "0 6 * * 1"

  # Allow manual execution
  workflow_dispatch:


permissions:

  contents: write


jobs:

  update-scholar:

    runs-on: ubuntu-latest


    steps:

      # ==========================================
      # CHECKOUT
      # ==========================================

      - name: Checkout repository

        uses: actions/checkout@v4


      # ==========================================
      # PYTHON
      # ==========================================

      - name: Set up Python

        uses: actions/setup-python@v5

        with:

          python-version: "3.11"


      # ==========================================
      # INSTALL SCHOLARLY
      # ==========================================

      - name: Install scholarly

        run: |

          python -m pip install --upgrade pip

          pip install scholarly


      # ==========================================
      # UPDATE SCHOLAR
      # ==========================================

      - name: Update Scholar metrics

        env:

          SCHOLAR_ID: nG62zRIAAAAJ

        run: |

          python scripts/update_scholar.py


      # ==========================================
      # CHECK CHANGES
      # ==========================================

      - name: Check for changes

        id: changes

        run: |

          if git diff --quiet data/scholar.json; then

            echo "changed=false" >> "$GITHUB_OUTPUT"

          else

            echo "changed=true" >> "$GITHUB_OUTPUT"

          fi


      # ==========================================
      # COMMIT
      # ==========================================

      - name: Commit updated metrics

        if: steps.changes.outputs.changed == 'true'

        run: |

          git config user.name \
            "github-actions[bot]"

          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/scholar.json

          git commit \
            -m "Update Google Scholar metrics"

          git push